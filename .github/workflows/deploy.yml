# .github/workflows/deploy.yml
name: Deploy to Digital Ocean

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=1536'
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_FEATURE_PLAYER_REVIEWS: ${{ secrets.NEXT_PUBLIC_FEATURE_PLAYER_REVIEWS }}

      - name: Build Socket.IO server
        run: npm run build:server

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Deploy artifacts to server
        run: |
          rsync -avz --delete \
            .next/ \
            root@${{ secrets.DROPLET_IP }}:/var/www/freeroll-dashboard/.next/

          rsync -avz --delete \
            dist/ \
            root@${{ secrets.DROPLET_IP }}:/var/www/freeroll-dashboard/dist/

          rsync -avz \
            public/ \
            root@${{ secrets.DROPLET_IP }}:/var/www/freeroll-dashboard/public/

          rsync -avz \
            prisma/ \
            root@${{ secrets.DROPLET_IP }}:/var/www/freeroll-dashboard/prisma/

          rsync -avz \
            package.json \
            package-lock.json \
            ecosystem.config.js \
            root@${{ secrets.DROPLET_IP }}:/var/www/freeroll-dashboard/

      - name: Install production dependencies and restart
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DROPLET_IP }} << 'EOF'
            set -e
            cd /var/www/freeroll-dashboard

            echo "Installing production dependencies..."
            npm install --omit=dev

            echo "Generating Prisma client..."
            npx prisma generate

            echo "Restarting application..."
            pm2 startOrRestart ecosystem.config.js --env production && pm2 save

            echo "Deployment completed successfully!"
          EOF
